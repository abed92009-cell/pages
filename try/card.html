<!doctype html><html lang="en-NZ"><head><meta charset="utf-8"><style>
@page{size:148mm 210mm;margin:0}
html,body{margin:0;padding:0}
body{width:148mm;height:210mm;background:#e9e7e0;color:#1c1c1a;
 font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mark{font-size:44px;font-weight:700;letter-spacing:-1px;margin:0 0 10mm}
.line{font-size:19px;color:#5f5e5a;margin:0 0 12mm;max-width:105mm}
.qr{background:#fff;padding:7mm;border-radius:6mm}
.qr img{display:block;width:72mm;height:72mm}
.scan{font-size:15px;color:#5f5e5a;margin:9mm 0 0}
footer{position:absolute;bottom:12mm;font-size:12px;color:#8c8b85}
</style></head><body>
<h1 class="mark">Detter</h1>
<p class="line">Try Detter. Every answer shows its maths.</p>
<div class="qr"><img src="detter-try.png" alt="QR code"></div>
<p class="scan">Point your camera at this.</p>
<footer>A MAG Product</footer>
</body></html>
